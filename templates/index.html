<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <!-- Responsive Viewport Fix for Mobile, Tablet, Desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lead Automation Dashboard</title>
    
    <style>
        /* ----------------------------------------------------
           1. LAYOUT & OVERFLOW FIXES (Mobile & Tablet Friendly)
        ---------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden; /* Text & Cards screen se bahir nahi jayenge */
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #1a202c;
            word-wrap: break-word;
        }

        /* Search Box Responsive Layout */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box input, .search-box button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            outline: none;
        }

        .search-box button {
            background-color: #3182ce;
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background-color: #2b6cb0;
        }

        /* ----------------------------------------------------
           2. GRID SYSTEM (1 Col Mobile, 2 Col Tablet, 3 Col Desktop)
        ---------------------------------------------------- */
        .leads-grid {
            display: grid;
            grid-template-columns: 1fr; /* Default Mobile */
            gap: 15px;
            width: 100%;
        }

        /* Tablet View (600px - 1023px) */
        @media (min-width: 600px) {
            .search-box {
                flex-direction: row;
            }
            .leads-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            h1 { font-size: 2rem; }
        }

        /* Desktop View (1024px and above) */
        @media (min-width: 1024px) {
            .leads-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ----------------------------------------------------
           3. CARD STYLING & RED PATI HIGHLIGHT
        ---------------------------------------------------- */
        .lead-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid #cbd5e0; /* Default Gray Border */
            position: relative;
            
            /* Text Overflow Safeguards */
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* TIER 1: RED PATI CLASS */
        .lead-card.red-pati {
            border-left: 6px solid #e53e3e; /* Red Border */
            background-color: #fff5f5; /* Light Red Tint */
        }

        /* TIER 2: CONTACT EXTRACTED CLASS */
        .lead-card.has-contact {
            border-left: 6px solid #38a169; /* Green Border */
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-red {
            background-color: #e53e3e;
            color: #ffffff;
        }

        .badge-green {
            background-color: #38a169;
            color: #ffffff;
        }

        .badge-gray {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .lead-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #2d3748;
        }

        .lead-card p {
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .contact-info {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
        }

        .whatsapp-link {
            display: inline-block;
            margin-top: 5px;
            color: #25d366;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Google Maps Lead Extractor</h1>
        </header>

        <!-- Search Inputs -->
        <div class="search-box">
            <input type="text" id="keyword" placeholder="Business Type (e.g. Web Developer)" value="Web Developer">
            <input type="text" id="location" placeholder="City / Area (e.g. Gulberg Lahore)" value="Lahore">
            <button onclick="loadLeads()">Search Leads</button>
        </div>

        <!-- Leads Container Grid -->
        <div id="leadsContainer" class="leads-grid">
            <!-- Dynamic JavaScript Content Will Render Here -->
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // FETCH & RENDER LEADS
        // ----------------------------------------------------
        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            const keyword = document.getElementById('keyword').value;
            const location = document.getElementById('location').value;

            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Loading sorted leads...</p>';

            try {
                const response = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}&location=${encodeURIComponent(location)}`);
                const result = await response.json();

                if (result.status === 'success' && result.data.length > 0) {
                    renderLeads(result.data);
                } else {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No leads found.</p>';
                }
            } catch (error) {
                console.error('Error fetching leads:', error);
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:red;">Failed to load data.</p>';
            }
        }

        function renderLeads(leads) {
            const container = document.getElementById('leadsContainer');
            container.innerHTML = '';

            leads.forEach(lead => {
                const isRedPati = lead.red_pati || lead.high_chance;
                const hasContact = lead.email || lead.whatsapp || lead.phone;

                // Determine Card Class & Badge
                let cardClass = '';
                let badgeHTML = '';

                if (isRedPati) {
                    cardClass = 'red-pati';
                    badgeHTML = '<span class="badge badge-red">Red Pati (High Chance)</span>';
                } else if (hasContact) {
                    cardClass = 'has-contact';
                    badgeHTML = '<span class="badge badge-green">Contact Extracted</span>';
                } else {
                    badgeHTML = '<span class="badge badge-gray">Basic Info</span>';
                }

                // Construct Card HTML
                const card = document.createElement('div');
                card.className = `lead-card ${cardClass}`;

                card.innerHTML = `
                    ${badgeHTML}
                    <h3>${lead.name}</h3>
                    <p><strong>Address:</strong> ${lead.address || 'N/A'}</p>
                    
                    <div class="contact-info">
                        <p><strong>Phone:</strong> ${lead.phone || 'Not extracted'}</p>
                        <p><strong>Email:</strong> ${lead.email || 'Not extracted'}</p>
                        ${lead.whatsapp ? `<a href="https://wa.me/${lead.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="whatsapp-link">💬 Chat on WhatsApp</a>` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Auto load on start
        window.onload = loadLeads;
    </script>
</body>
</html>
